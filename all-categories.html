<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Categories - Lamar Phone and Gadget</title>
    <link rel="stylesheet" href="all-categories.css">
    <link rel="stylesheet" href="assets/fontawesome/fontawesome.min.css">
    <link rel="stylesheet" href="desktop-style.css">
</head>
<body>
    <div class="container">
        <h1>All Categories</h1>
        <div class="categories-grid">
            <div class="category-card" data-category="phones">
                <img src="assets/images/phone-category.jpg" alt="Phones">
                <h2>Phones</h2>
                <p>Browse our collection of smartphones</p>
            </div>
            <div class="category-card" data-category="laptops">
                <img src="assets/images/laptop-category.jpg" alt="Laptops">
                <h2>Laptops</h2>
                <p>Explore our laptop selection</p>
            </div>
            <div class="category-card" data-category="tablets">
                <img src="assets/images/tablet-category.jpg" alt="Tablets">
                <h2>Tablets</h2>
                <p>Find the perfect tablet</p>
            </div>
            <div class="category-card" data-category="accessories">
                <img src="assets/images/accessories-category.jpg" alt="Accessories">
                <h2>Accessories</h2>
                <p>Essential gadget accessories</p>
            </div>
            <div class="category-card" data-category="tvs">
                <img src="assets/images/tv-category.jpg" alt="TVs">
                <h2>TVs</h2>
                <p>Smart TVs and displays</p>
            </div>
        </div>
    </div>
    <script src="all-categories.js"></script>
</body>
</html>
