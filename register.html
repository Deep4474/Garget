<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Registration</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="footer-section.css">
  <link rel="stylesheet" href="register-new.css">
  <style>
    .register-container {
      max-width: 420px;
      margin: 32px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px 24px 24px 24px;
      font-family: inherit;
    }
    .register-logo {
      display: block;
      margin: 0 auto 8px auto;
      height: 38px;
    }
    .register-title {
      text-align: center;
      color: #e64a19;
      font-size: 1.5em;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .register-subtitle {
      text-align: center;
      color: #222;
      font-size: 1.1em;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .register-form label {
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
      color: #222;
    }
    .register-form input[type="text"],
    .register-form input[type="email"],
    .register-form input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 18px;
      font-size: 1em;
      background: #fafafa;
      color: #222;
    }
    .register-form .input-row {
      position: relative;
    }
    .register-form .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1em;
      color: #888;
    }
    .register-form .password-hint {
      font-size: 0.93em;
      color: #888;
      margin-top: -14px;
      margin-bottom: 12px;
      text-align: right;
    }
    .register-form .terms {
      margin-bottom: 18px;
      font-size: 0.98em;
      color: #222;
    }
    .register-form .terms a {
      color: #e64a19;
      text-decoration: underline;
    }
    .register-form .terms-label {
      display: inline;
    }
    .register-form .register-btn {
      width: 100%;
      background: #e64a19;
      color: #fff;
      font-size: 1.1em;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      padding: 13px 0;
      margin-top: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .register-form .register-btn:hover {
      background: #c0390b;
    }
    .register-form .login-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #e64a19;
      font-weight: 600;
      text-decoration: none;
      font-size: 1em;
    }
    .register-form .login-link:hover {
      text-decoration: underline;
    }
    .register-form .or-separator {
      text-align: center;
      margin: 18px 0 0 0;
      font-size: 1em;
      color: #222;
      font-weight: 500;
    }
    .register-form .email-btn {
      background: #4285F4;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="register-container">
  <img src="assets/images/smartphone.png" alt="Logo" class="register-logo" onerror="this.style.display='none'">
    <div class="register-title">CREATE AN ACCOUNT.</div>
    <form class="register-form" autocomplete="off">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Full Name" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Email" required>
      <label for="password">Password</label>
      <div class="input-row">
        <input type="password" id="password" name="password" placeholder="Password" required minlength="6">
        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">&#128065;</button>
      </div><br>
      <div class="password-hint">Password must contain at least 6 digits</div>
      <label for="confirm-password">Confirm Password</label>
      <div class="input-row">
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required minlength="6">
        <button type="button" class="toggle-password" onclick="togglePassword('confirm-password', this)">&#128065;</button>
      </div>
      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">By signing up you agree to our <a href="#">terms and conditions</a></label>
      </div>
      <button type="submit" class="register-btn">Create Account</button>
      <div class="or-separator">or</div>
  <div class="gmail-instruction">Click the button below to sign up with your Gmail account.</div>
      <button type="button" class="register-btn email-btn gmail-btn-flex" id="continueWithGmailBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="gmail-btn-icon"> 
        Continue with Gmail
      </button>
      <a href="#login" class="login-link">Already have an account? Log In</a>
    </form>
  </div>
  <script>
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '&#128064;';
      } else {
        input.type = 'password';
        btn.innerHTML = '&#128065;';
      }
    }

    // Supabase Gmail OAuth for 'Continue with Gmail' using Google provider
    (function(){
      var gmailBtn = document.getElementById('continueWithGmailBtn');
      if (!gmailBtn) return;
      gmailBtn.addEventListener('click', function(){
        // Use the production Netlify URL for redirect
        const registerUrl = 'https://lamarphoneandgadget.netlify.app/phonefolder/register.html';
        const url = 'https://jlwxkykznyjmstpjcgks.supabase.co/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(registerUrl);
        window.location.href = url;
      });
    })();

    // Parse access token and user info from URL hash after Google OAuth
    function parseHashParams() {
      const hash = window.location.hash.substr(1);
      const params = {};
      hash.split('&').forEach(function(part) {
        const item = part.split('=');
        if (item[0]) params[item[0]] = decodeURIComponent(item[1]);
      });
      return params;
    }

    window.addEventListener('DOMContentLoaded', function() {
      const params = parseHashParams();
      if (params['access_token']) {
        // Optionally, you can store the token in localStorage/sessionStorage
        // localStorage.setItem('access_token', params['access_token']);

        // Try to parse user info from id_token or user_metadata if available
        // For demo, just show a welcome message
        let userInfo = '';
        if (params['user_metadata']) {
            try {
            const meta = JSON.parse(params['user_metadata']);
            userInfo = `<div class="register-welcome">Welcome, <b>${meta.full_name || meta.name || ''}</b><br>Email: <b>${meta.email || ''}</b></div>`;
          } catch(e) {}
        }
        if (!userInfo && params['access_token']) {
          userInfo = `<div class="register-welcome">Login successful! (Google OAuth)</div>`;
        }
        // Insert user info above the form
        const form = document.querySelector('.register-form');
        if (form && userInfo) {
          const div = document.createElement('div');
          div.innerHTML = userInfo;
          form.parentNode.insertBefore(div, form);
        }
        // Optionally, clear the hash from the URL
        history.replaceState(null, '', window.location.pathname);
      }
    });
  </script>
  <script>
    // Two-step registration: send verification code to email, then verify code + create account
    (function(){
      const form = document.querySelector('.register-form');
      const API_BASE = window.API_BASE || 'http://localhost:3000';
      if (!form) return;

      // Helper to render a status message at the bottom of the form
      function setStatus(msg, isError) {
        let status = form.querySelector('.register-status');
        if (!status) { status = document.createElement('div'); status.className = 'register-status'; status.style.marginTop = '12px'; form.appendChild(status); }
        status.textContent = msg || '';
        status.style.color = isError ? 'crimson' : '#222';
      }

      // Step 1: request a verification code
      async function sendCode(email) {
        console.log('sendCode: sending request to', API_BASE + '/users/send-code', 'body:', { email });
        const resp = await fetch(API_BASE + '/users/send-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
        const text = await resp.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch(e) { data = { _raw: text }; }
        return { ok: resp.ok, status: resp.status, data };
      }

      // Step 2: verify code and create user
      async function verifyCode(payload) {
        const resp = await fetch(API_BASE + '/users/verify-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const text = await resp.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch(e) { data = { _raw: text }; }
        return { ok: resp.ok, status: resp.status, data };
      }

      form.addEventListener('submit', async function(e){
        e.preventDefault();
        const name = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        if (!name || !email) { setStatus('Please enter name and email', true); return; }
        setStatus('Sending verification code...');
        try {
          const res = await sendCode(email);
          if (!res.ok) {
            setStatus('Failed to send code: ' + (res.data && (res.data.error || res.data.message) ? (res.data.error || res.data.message) : res.status), true);
            console.warn('send-code failed', res);
            return;
          }

          // If server returned a code (dev mode or mail failure), show it to developer in UI for easier testing.
          if (res.data && res.data.code) {
            // store the last received dev code so we can auto-fill the verification input
            window._lastDevCode = String(res.data.code);
            setStatus('Code (dev): ' + window._lastDevCode + '. Enter it below to complete registration.');
          } else {
            setStatus('Verification code sent to ' + email + '. Enter the code below.');
          }

          // Replace form with verification step (keep name/email visible but disable editing)
          renderVerificationStep(name, email);
        } catch (err) {
          console.error('sendCode exception', err);
          setStatus('Error sending code: ' + (err && err.message ? err.message : String(err)), true);
        }
      });

      function renderVerificationStep(name, email) {
        // Clear existing password inputs (if any) and replace submit button with verify flow
        form.querySelector('#fullname').value = name;
        form.querySelector('#fullname').disabled = true;
        form.querySelector('#email').value = email;
        form.querySelector('#email').disabled = true;

        // Remove existing password/confirm inputs if present
        const pw = form.querySelector('#password');
        const conf = form.querySelector('#confirm-password');
        if (pw) pw.parentNode.style.display = '';
        if (conf) conf.parentNode.style.display = '';

        // Add code input
        let codeRow = form.querySelector('.code-row');
        if (!codeRow) {
          codeRow = document.createElement('div'); codeRow.className = 'code-row';
          const lbl = document.createElement('label'); lbl.textContent = 'Verification code'; lbl.htmlFor = 'verify-code';
          const input = document.createElement('input'); input.type = 'text'; input.id = 'verify-code'; input.name = 'verify-code'; input.placeholder = 'Enter code'; input.required = true; input.style.marginBottom = '12px';
          codeRow.appendChild(lbl); codeRow.appendChild(input);
          // If a code was returned by the server (dev mode), show it and provide a copy button
          if (window._lastDevCode) {
            const devNote = document.createElement('div');
            devNote.className = 'dev-code-note';
            devNote.style.margin = '8px 0 12px 0';
            devNote.style.fontSize = '0.95em';
            devNote.style.color = '#444';
            devNote.innerHTML = `Detected dev code: <b>${window._lastDevCode}</b> <button type="button" id="copyDevCodeBtn" style="margin-left:8px;padding:6px 8px; border-radius:4px; border:1px solid #ddd; background:#f5f5f5; cursor:pointer;">Copy</button>`;
            codeRow.appendChild(devNote);
            setTimeout(() => {
              const copyBtn = document.getElementById('copyDevCodeBtn');
              if (copyBtn) copyBtn.addEventListener('click', () => {
                try { navigator.clipboard.writeText(window._lastDevCode); setStatus('Dev code copied to clipboard'); } catch(e) { setStatus('Dev code: ' + window._lastDevCode); }
              });
            }, 20);
          }
          // Insert before password hint (or before confirm)
          const hint = form.querySelector('.password-hint');
          if (hint) form.insertBefore(codeRow, hint.nextSibling);
          else form.appendChild(codeRow);
        }

        // Change button to 'Verify & Create'
        const btn = form.querySelector('.register-btn');
        btn.textContent = 'Verify & Create';
        btn.onclick = async function(ev){
          ev.preventDefault();
          const code = document.getElementById('verify-code').value.trim();
          // if developer mode and no code entered, try to auto-fill from server-returned code
          if (!code && window._lastDevCode) {
            document.getElementById('verify-code').value = window._lastDevCode;
          }
          const password = document.getElementById('password').value;
          const confirm = document.getElementById('confirm-password').value;
          if (!code || !password) { setStatus('Enter code and choose a password', true); return; }
          if (password.length < 6) { setStatus('Password must be at least 6 characters', true); return; }
          if (password !== confirm) { setStatus('Passwords do not match', true); return; }
          setStatus('Verifying code and creating account...');
          try {
            const payload = { email, code, password, user_metadata: { full_name: name } };
            const res = await verifyCode(payload);
            if (!res.ok) {
              setStatus('Verification failed: ' + (res.data && (res.data.error || res.data.message) ? (res.data.error || res.data.message) : res.status), true);
              console.warn('verify-code failed', res);
              return;
            }

            // If server created user (201) and returned user, try to sign in with Supabase client
            if (res.status === 201 && res.data && res.data.user) {
              // Server created the user and stored it in user.json.
              // Save minimal info locally and redirect to index.html.
              try { 
                localStorage.setItem('userName', name); 
                localStorage.setItem('userEmail', email);
                // If we're on index.html, update the menu immediately
                if (typeof updateMenuAuth === 'function') {
                  updateMenuAuth();
                }
              } catch(e){}
              // Attempt Supabase sign-in if available (non-blocking). Regardless, redirect to index.
              if (window.supabaseClient && window.supabaseClient.auth && typeof window.supabaseClient.auth.signInWithPassword === 'function') {
                window.supabaseClient.auth.signInWithPassword({ email, password }).catch(() => {});
              }
              setStatus('Account created. Redirecting to home...');
              setTimeout(() => { window.location.href = 'index.html'; }, 700);
              return;
            }

            // If server responded ok but did not create user (fallback), attempt client-side signUp
            if (res.data && res.data.ok) {
              if (window.supabaseClient && window.supabaseClient.auth && typeof window.supabaseClient.auth.signUp === 'function') {
                const { data: signupData, error: signupError } = await window.supabaseClient.auth.signUp({ email, password }, { data: { full_name: name } });
                if (signupError) {
                  setStatus('Account created but sign-up failed: ' + (signupError.message || JSON.stringify(signupError)), true);
                  return;
                }
                setStatus('Account created — please check your email to confirm (if required). Redirecting...');
                try { localStorage.setItem('userName', name); localStorage.setItem('userEmail', email); } catch(e){}
                setTimeout(() => { window.location.href = 'index.html'; }, 1200);
                return;
              }
            }

            setStatus('Verification succeeded. Please sign in.');
            setTimeout(() => { window.location.href = 'login.html'; }, 900);
          } catch (err) {
            console.error('verify exception', err);
            setStatus('Verification error: ' + (err && err.message ? err.message : String(err)), true);
          }
        };
      }
    })();
  </script>
</body>
</html>
