<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat - Lamar Phone And Gadget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-compact-header">
    <div class="left">
      <span class="brand-text">Lamar Phone And Gadget</span>
    </div>
    <div class="header-actions"></div>
  </header>

  <main class="cart-page-main">

      <div id="chatContainer" class="cart-items-mobile">
        <button class="cart-float-btn" aria-hidden="true" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
         

        </button>
        <div class="totalamount">
          <span class="Total">₦0</span>
        </div>
        <div class="cart-steps" aria-hidden="true">
          <div class="cart-step active">
            <!-- inline cart svg (uses currentColor) -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
              <circle cx="9" cy="21" r="1" stroke="currentColor" stroke-width="2" fill="none" />
              <circle cx="20" cy="21" r="1" stroke="currentColor" stroke-width="2" fill="none" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h7.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <div class="cart-step">
            <!-- inline home svg -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
              <path d="M3 11.5L12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11.5z" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <div class="cart-step">
            <!-- inline notification svg -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="24" height="24" aria-hidden="true">
              <circle cx="4" cy="10" r="2" fill="currentColor" />
              <circle cx="10" cy="10" r="2" fill="currentColor" />
              <circle cx="16" cy="10" r="2" fill="currentColor" />
            </svg>
          </div>
          <div class="cart-step">
            <!-- inline search svg -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="24" height="24" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="2" fill="none" />
              <line x1="13" y1="13" x2="17" y2="17" stroke="currentColor" stroke-width="2" />
            </svg>
          </div>
          <div class="cart-step">
            <!-- inline user svg -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="24" height="24" fill="none" aria-hidden="true">
              <circle cx="10" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none" />
              <path d="M3 18c0-3.5 14-3.5 14 0" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
          </div>
        </div>


      <div class="cart-footer-tiles">
        <div class="tile"><div class="tile-ico">📝</div><div class="tile-text">Start a new chat</div></div>
        <div class="tile"><div class="tile-ico">❓</div><div class="tile-text">FAQ</div></div>
        <div class="tile"><div class="tile-ico">📞</div><div class="tile-text">Contact Support</div></div>
        <div class="tile"><div class="tile-ico">⚙️</div><div class="tile-text">Settings</div></div>
          <!-- Checkout trigger for mobile/chat page -->
          <div class="tile" id="mobileCheckoutBtn"><div class="tile-ico">💳</div><div class="tile-text">Checkout</div></div>
        </div>

        <!-- Hidden cart modal where the checkout form will be injected by script.js -->
        <div id="cartModal" class="modal hidden" aria-hidden="true">
          <div class="modal-content cart-modal-content">
            <button id="closeCartModal" class="close-modal" aria-label="Close">&times;</button>
            <!-- cart items placeholder (script may hide this when showing form) -->
            <div class="cart-items">
              <p>Your cart items will appear here.</p>
            </div>
          </div>
        </div>
      </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
  <script>
    (function(){
      const CART_KEY = 'lmg_cart_v1';
      function formatPrice(p){ try { return '₦' + Number(p).toLocaleString(); } catch(e){ return p; } }
      function updateTotalSpan(){
        try{
          const raw = localStorage.getItem(CART_KEY);
          const items = raw ? JSON.parse(raw) : [];
          const total = (items || []).reduce((s,it)=> s + (Number(it.price)||0) * (Number(it.qty)||1), 0);
          const span = document.querySelector('#chatContainer .Total');
          if (span) span.textContent = formatPrice(total);
        }catch(e){ /* ignore */ }
      }

      // Scroll container to bottom so newly added products are visible.
      function scrollChatContainerToBottom(behavior = 'auto'){
        try{
          const container = document.getElementById('chatContainer');
          if (!container) return;
          // Use scrollTop = scrollHeight to ensure all children are visible
          container.scrollTo({ top: container.scrollHeight, behavior });
        }catch(e){ /* ignore */ }
      }

      document.addEventListener('DOMContentLoaded', function(){ updateTotalSpan(); /* small delay to allow rendering then scroll */ setTimeout(()=>scrollChatContainerToBottom('auto'), 60); });
      window.addEventListener('storage', function(e){ if (e.key === CART_KEY) { updateTotalSpan(); scrollChatContainerToBottom('smooth'); } });
      window.addEventListener('cart:updated', function(){ updateTotalSpan(); scrollChatContainerToBottom('smooth'); });
    })();
  </script>
</body>
</html>
