<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lamar Phone & Gadget</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">SU</div>
    <div class="login-title">WELCOME BACK !</div>
    <div class="login-subtitle">Login to your account.</div>
    <form class="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="login-email" placeholder="johndoe@example.com" required>
      <label for="login-password">Password</label>
      <div class="input-row">
        <input type="password" id="login-password" name="login-password" placeholder="Password" required>
        <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">&#128065;</button>
      </div>
      <div class="login-options">
        <label class="remember-me"><input type="checkbox" id="rememberMe"> Remember Me</label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
  </div>
  <script>
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '&#128064;';
      } else {
        input.type = 'password';
        btn.innerHTML = '&#128065;';
      }
    }
  </script>
</body>
</html>
