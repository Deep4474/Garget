<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart - Lamar Phone And Gadget</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Minimal mobile-specific helpers to match the screenshot */
    .lamar-header {background:#fff; border-bottom:1px solid #eee;}
    .lamar-header-content{display:flex;align-items:center;justify-content:space-between;padding:10px}
    .lamar-header-logo{font-weight:700;color:#e53935;font-size:20px}
    .cart-items-mobile{padding:12px}
    .cart-float-btn{position:absolute;left:12px;top:120px;background:#17a673;color:#fff;border-radius:50%;width:40px;height:40px;border:none;display:flex;align-items:center;justify-content:center}
    .cart-steps{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0}
    .cart-step{background:#f7f7f7;padding:10px;border-radius:6px;display:flex;align-items:center;justify-content:center;width:56px;height:56px}
    .cart-step.active{border:2px solid #e53935;background:#fff}
    .cart-empty-box{margin:22px auto;padding:26px;border:1px solid #f0f0f0;border-radius:6px;text-align:center;background:#fff}
    .cart-empty-ico{font-size:36px;margin-bottom:6px}
    .cart-empty{font-weight:700;color:#222}
  .cart-helper{color:#777;margin-top:8px;font-size:13px}
    .cart-footer-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
    .tile{background:#fff;border:1px solid #f0f0f0;padding:14px;border-radius:6px;display:flex;align-items:center;gap:10px}
    .tile-ico{font-size:20px}
    .cart-page-footer{display:none}
  /* bottom nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#0b57ff;display:flex;align-items:center;box-shadow:0 -2px 6px rgba(0,0,0,0.08)}
  .bottom-nav a{flex:1;text-decoration:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;padding:6px 0}
  .bottom-nav a .nav-ico{font-size:18px;line-height:1;margin-bottom:4px;color:rgba(255,255,255,0.95)}
  .bottom-nav a .nav-label{font-size:11px;color:rgba(255,255,255,0.95)}
  .bottom-nav a.active{background:transparent;color:#ff6a00}
  .bottom-nav a.active .nav-ico{color:#ff6a00}
  .bottom-nav a.active .nav-label{color:#ff6a00}
  .bottom-cart{display:flex;align-items:center;gap:6px}
  .bottom-cart-count{color:#ff6a00}
    @media(min-width:720px){.cart-float-btn{display:none}}
  </style>
</head>
<body>
  <header class="top-compact-header">
    <div class="left">
      <span class="brand-text">Lamar Phone And Gadget</span>
    </div>
    <div class="header-actions"></div>
  </header>

  <main class="cart-page-main">
    

      <div id="cartItemsContainer" class="cart-items-mobile">
        <button class="cart-float-btn" aria-hidden="true" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="cart-steps" aria-hidden="true">
          <div class="cart-step active" title="Cart">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
              <circle cx="9" cy="21" r="1" stroke="currentColor" stroke-width="2" fill="none" />
              <circle cx="20" cy="21" r="1" stroke="currentColor" stroke-width="2" fill="none" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h7.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <div class="cart-step" title="Address">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
              <path d="M3 11.5L12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11.5z" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <div class="cart-step" title="Delivery">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="24" height="24" aria-hidden="true">
              <circle cx="4" cy="10" r="2" fill="currentColor" />
              <circle cx="10" cy="10" r="2" fill="currentColor" />
              <circle cx="16" cy="10" r="2" fill="currentColor" />
            </svg>
          </div>
          <div class="cart-step" title="Payment">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="24" height="24" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="2" fill="none" />
              <line x1="13" y1="13" x2="17" y2="17" stroke="currentColor" stroke-width="2" />
            </svg>
          </div>
          <div class="cart-step" title="Account">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="24" height="24" fill="none" aria-hidden="true">
              <circle cx="10" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none" />
              <path d="M3 18c0-3.5 14-3.5 14 0" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
          </div>
        </div>
        <div class="cart-empty-box">
          <div class="cart-empty-ico">😕</div>
          <div class="cart-empty">Your Cart is empty</div>
          <div class="cart-helper">Add items to your cart to see them here</div>
        </div>
      </div>

      <!-- simplified footer for mobile (checkout hidden when cart empty) -->
      <!-- Grand total card shown above the tiles -->
      <div class="grand-total-card">
        <div class="grand-total-row">
          <div class="grand-total-title">Total to pay</div>
          <div class="grand-total-controls">
            <div id="grandTotal" class="grand-total-amount">₦0</div>
            <button id="checkoutBtn" class="checkout-btn" disabled>Checkout</button>
          </div>
        </div>
      </div>
      <!-- footer tiles removed per design request -->
      <!-- footer intentionally left empty (checkout moved next to total) -->
      <!-- Hidden cart modal where the checkout form will be injected by script.js -->
      <div id="cartModal" class="modal hidden" aria-hidden="true">
        <div class="modal-content cart-modal-content">
          <button id="closeCartModal" class="close-modal" aria-label="Close">&times;</button>
          <!-- cart items placeholder (script may hide this when showing form) -->
          <div class="cart-items">
            <p>Your cart items will appear here.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- bottom navigation bar for mobile like the screenshot -->
  <nav class="bottom-nav" aria-hidden="false">
    <a href="index.html">
      <span class="nav-ico">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="cart.html" class="active">
      <span class="nav-ico">🛒</span>
      <span class="nav-label">Cart</span>
    </a>
    <a href="notifications.html">
      <span class="nav-ico">🔔</span>
      <span class="nav-label">Notifications</span>
    </a>
    <a href="account.html">
      <span class="nav-ico">👤</span>
      <span class="nav-label">My Account</span>
    </a>
  </nav>

  <!-- include cart logic so totals (if any) can render -->
  <script src="cart.js"></script>
  <!-- Supabase SDK and config so script.js can initialize a real client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase-config.js"></script>
  <!-- reuse site script if needed -->
  <script src="script.js"></script>
  <!-- Inline helper: ensure cart total shows from localStorage and updates on storage events -->
  <script>
    (function(){
      const CART_KEY = 'lmg_cart_v1';
      function formatPrice(p){ try { return '₦' + Number(p).toLocaleString(); } catch(e){ return p; } }
      function computeAndShowTotal(){
        try{
          const raw = localStorage.getItem(CART_KEY);
          const items = raw ? JSON.parse(raw) : [];
          const total = (items || []).reduce((s,it)=> s + (Number(it.price)||0) * (Number(it.qty)||1), 0);
          const totalEl = document.getElementById('cartTotal');
          const grandEl = document.getElementById('grandTotal');
          const grandCard = document.querySelector('.grand-total-card');
          if (totalEl) totalEl.textContent = formatPrice(total);
          if (grandEl) grandEl.textContent = formatPrice(total);
          if (grandCard) {
            if (items && items.length) { grandCard.classList.add('visible'); grandCard.classList.remove('hidden'); }
            else { grandCard.classList.remove('visible'); grandCard.classList.add('hidden'); }
          }
          const footer = document.querySelector('.cart-page-footer');
          const checkoutBtn = document.getElementById('checkoutBtn');
          if (footer) {
            if (items && items.length) { footer.classList.add('visible'); footer.classList.remove('hidden'); }
            else { footer.classList.remove('visible'); footer.classList.add('hidden'); }
          }
          if (checkoutBtn) checkoutBtn.disabled = !(items && items.length);
        }catch(e){/* ignore parse errors */}
      }
      // run on load
      document.addEventListener('DOMContentLoaded', computeAndShowTotal);
      // update when other tabs modify storage
      window.addEventListener('storage', function(e){ if (e.key === CART_KEY) computeAndShowTotal(); });
      // also listen for a custom event if other scripts dispatch it
      window.addEventListener('cart:updated', computeAndShowTotal);
    })();
  </script>
  <script>
    // Wire the cart page checkout button to show the shared checkout modal/form
    document.addEventListener('DOMContentLoaded', function(){
      var checkoutBtn = document.getElementById('checkoutBtn');
      if (checkoutBtn) {
        checkoutBtn.addEventListener('click', function(e){
          // If cart has items, navigate to the dedicated checkout page. Otherwise fall back to modal.
          try{
            var raw = localStorage.getItem('lmg_cart_v1');
            var items = raw ? JSON.parse(raw) : [];
            if (items && items.length) {
              // navigate to standalone checkout page
              window.location.href = 'checkout.html';
              return;
            }
          }catch(err){ /* ignore parse errors */ }
          // fallback: open the injected modal form if available
          if (typeof showCartCheckoutForm === 'function') {
            showCartCheckoutForm();
          } else {
            alert('Your cart is empty.');
          }
        });
      }
    });
  </script>
</body>
</html>
