    <!-- Buy Modal -->

  <form id="orderForm" class="order-form">

  <script src="script.js"></script>
<script>
// Initialize Supabase client ONCE and reuse
// Supabase client is initialized only once at the top of this script.

// Supabase Auth logic for Account menu
document.addEventListener('DOMContentLoaded', async function() {
  const accountLink = document.getElementById('accountMenuLink');
  if (accountLink) {
    accountLink.addEventListener('click', async function(e) {
      e.preventDefault();
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        // Start Google OAuth sign-in
        supabase.auth.signInWithOAuth({ provider: 'google' });
      } else {
        // Show user info in the menu drawer
        const menuDrawerContent = document.querySelector('.menu-drawer-content');
        if (menuDrawerContent) {
          let profileHtml = `<div style="display:flex;align-items:center;padding:1em 0;border-bottom:1px solid #eee;">
            <img src="${user.user_metadata.avatar_url || 'assets/profile.jpg'}" style="width:40px;height:40px;border-radius:50%;margin-right:10px;" alt="Profile" />
            <div>
              <div style="font-weight:bold;">${user.user_metadata.full_name || user.user_metadata.name || 'User'}</div>
              <div style="font-size:0.9em;color:#555;">${user.email}</div>
            </div>
          </div>`;
          let oldProfile = menuDrawerContent.querySelector('.account-profile-info');
          if (oldProfile) oldProfile.remove();
          menuDrawerContent.insertAdjacentHTML('afterbegin', `<div class="account-profile-info">${profileHtml}</div>`);
        }
      }
    });
  }
    async function showUserProfile(user) {
      const menuDrawerContent = document.querySelector('.menu-drawer-content');
      if (menuDrawerContent && user) {
        let profileHtml = `<div style="display:flex;align-items:center;padding:1em 0;border-bottom:1px solid #eee;">
          <img src="${user.user_metadata.avatar_url || 'assets/profile.jpg'}" style="width:40px;height:40px;border-radius:50%;margin-right:10px;" alt="Profile" />
          <div>
            <div style="font-weight:bold;">${user.user_metadata.full_name || user.user_metadata.name || 'User'}</div>
            <div style="font-size:0.9em;color:#555;">${user.email}</div>
          </div>
        </div>`;
        let oldProfile = menuDrawerContent.querySelector('.account-profile-info');
        if (oldProfile) oldProfile.remove();
        menuDrawerContent.insertAdjacentHTML('afterbegin', `<div class="account-profile-info">${profileHtml}</div>`);
      }
    }

    // Restore session and show user info if already logged in
    if (supabase && supabase.auth && typeof supabase.auth.getUser === 'function') {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        showUserProfile(user);
      }
    }
    // My Orders click event: fetch and show 'ordersend' from Supabase
    const ordersLink = document.querySelector('.menu-link[href="#orders"]');
    if (ordersLink) {
      ordersLink.addEventListener('click', async function(e) {
        e.preventDefault();
        // Get current user
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
          alert('Please sign in to view your orders.');
          return;
        }
        const userEmail = user.email;
        // Fetch both 'orders' and 'order_sender' table data for this user
        const [ordersRes, senderRes] = await Promise.all([
          supabase.from('orders').select('*').eq('email', userEmail),
          supabase.from('order_sender').select('*').eq('email', userEmail)
        ]);
        const ordersData = ordersRes.data || [];
        const senderData = senderRes.data || [];
        const ordersError = ordersRes.error;
        const senderError = senderRes.error;
        const ordersGrid = document.getElementById('ordersGrid');
        if (ordersGrid) {
          ordersGrid.style.display = 'block';
        }
        let html = '';
        if (ordersError || senderError) {
          html += `<div style="color:red;">Error fetching data: ${ordersError?.message || ''} ${senderError?.message || ''}</div>`;
        }
        // Create modal for orders
        let modalHtml = `<div id="ordersModal" class="modal" style="display:block;z-index:9999;">
          <div class="modal-content" style="width:99vw;max-width:1200px;margin:8px auto;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.12);padding:8px;position:relative;overflow-x:auto;">
            <span class="close" id="closeOrdersModal" style="position:absolute;top:12px;right:16px;font-size:1.5em;cursor:pointer;">&times;</span>
            <h2 style='text-align:center;font-size:1.3em;font-weight:700;margin-bottom:8px;'>My Orders</h2>
            ${ordersData.length > 0 ? `<div style='text-align:center;color:#2e7d32;font-size:1.1em;font-weight:600;margin-bottom:4px;'>Your order has been successful!</div>
            <div style='text-align:center;color:#1565c0;font-size:1em;margin-bottom:8px;'>Order Status:</div>
            <ul style='text-align:left;max-width:400px;margin:0 auto 16px auto;padding:0;list-style:none;'>
              ${ordersData.map((order, idx) => {
                let dateStr = order.created_at ? new Date(order.created_at).toLocaleString() : 'N/A';
                return `<li style='margin-bottom:4px;border-bottom:1px solid #eee;padding-bottom:2px;'><span style='font-weight:600;'>Order ${idx+1}:</span> <span style='color:#1565c0;'>${order.status || 'N/A'}</span> <span style='color:#444;font-size:0.97em;'>(Placed: ${dateStr})</span></li>`;
              }).join('')}
            </ul>` : ''}

            ${senderData.length > 0 ? `<div style='text-align:center;color:#2e7d32;font-size:1.1em;font-weight:600;margin-bottom:4px;'>Your order sender has been successful!</div>
            <div style='text-align:center;color:#1565c0;font-size:1em;margin-bottom:8px;'>Order Sender Status:</div>
            <ul style='text-align:left;max-width:400px;margin:0 auto 16px auto;padding:0;list-style:none;'>
              ${senderData.map((sender, idx) => {
                let dateStr = sender.created_at ? new Date(sender.created_at).toLocaleString() : 'N/A';
                return `<li style='margin-bottom:4px;border-bottom:1px solid #eee;padding-bottom:2px;'><span style='font-weight:600;'>Order Sender ${idx+1}:</span> <span style='color:#1565c0;'>${sender.status || 'N/A'}</span> <span style='color:#444;font-size:0.97em;'>(Placed: ${dateStr})</span></li>`;
              }).join('')}
            </ul>` : ''}
              <!-- Orders table removed as requested -->
          </div>
        </div>`;
        // Hide menu drawer
        const menuDrawer = document.getElementById('menuDrawer');
        if (menuDrawer) menuDrawer.style.display = 'none';
        // Remove any previous modal
        let oldModal = document.getElementById('ordersModal');
        if (oldModal) oldModal.remove();
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        // Add close event
        document.getElementById('closeOrdersModal').onclick = function() {
          document.getElementById('ordersModal').remove();
        };
        // Show order senders below the modal as before
        let sendersHtml = '<div class="order-senders-section"><h3>Order Senders</h3>';
        if (senderData.length === 0) {
          sendersHtml += '<div class="no-orders-message">No order senders found for this user</div>';
        } else {
          sendersHtml += '<ul style="list-style:none;padding:0;">' +
            senderData.map(sender => `<li>Order ID: ${sender.order_id || ''}, Phone: ${sender.phone || ''}, Address: ${sender.address || ''}, Quantity: ${sender.quantity || ''}, Total: ${sender.order_total || ''}, Status: ${sender.status || ''}, Created: ${sender.created_at || ''}, Pick Option: ${sender.pick_option || ''}</li>`).join('') + '</ul>';
        }
        sendersHtml += '</div>';
        if (ordersGrid) {
          ordersGrid.innerHTML = sendersHtml;
        }
      });
    }
});
</script>
